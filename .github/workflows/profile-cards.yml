name: Update profile cards
on:
  schedule:
    - cron: "17 17 * * *"   # tiap hari 00:17 WIB
  workflow_dispatch:
  push:
    paths: ["config.json", "generate.py", "assets/**"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate cards
        env:
          GITHUB_TOKEN: ${{ secrets.CARDS_TOKEN || secrets.GITHUB_TOKEN }}
        run: python generate.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cards README.md
          git diff --cached --quiet || git commit -m "chore: update profile cards"
          git push
